<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Flow Neurotech</title>
  <style>
    :root {
      --bg: #0b1017;
      --panel: rgba(18, 24, 33, 0.95);
      --panel-soft: rgba(24, 32, 44, 0.92);
      --text: #f4f1ec;
      --muted: #8a96a1;
      --accent: #8f95ff;
      --accent2: #5fd3d3;
      --border: rgba(149, 159, 177, 0.16);
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.32);
      --radius: 30px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(95, 211, 211, 0.12), transparent 22%),
                  radial-gradient(circle at 80% 20%, rgba(143, 149, 255, 0.13), transparent 16%),
                  linear-gradient(180deg, #0b1118 0%, #090c13 100%);
      padding: 32px;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      align-items: stretch;
      margin-bottom: 32px;
    }

    .hero-copy {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      text-transform: uppercase;
      font-size: 0.74rem;
      letter-spacing: 0.32em;
      color: var(--accent);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 4vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-family: "Georgia", serif;
    }

    p.lead {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.85;
      max-width: 42rem;
    }

    .hero-visual {
      background: linear-gradient(180deg, rgba(17, 27, 40, 0.96), rgba(12, 17, 25, 0.98));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      min-height: 420px;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-visual::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      top: 22%;
      right: -8%;
      background: radial-gradient(circle, rgba(95, 211, 211, 0.16), transparent 60%);
      filter: blur(22px);
    }

    .hero-visual::after {
      content: "FLOW NEUROTECH";
      position: absolute;
      left: 28px;
      top: 28px;
      font-size: 0.82rem;
      letter-spacing: 0.35em;
      color: rgba(159, 173, 191, 0.75);
      text-transform: uppercase;
    }

    .hero-visual .image-placeholder {
      width: 100%;
      max-width: 460px;
      height: 320px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(143, 149, 255, 0.16), rgba(95, 211, 211, 0.08));
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(244, 241, 236, 0.65);
      font-size: 1rem;
      text-align: center;
      padding: 24px;
    }

    .panel {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 26px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 1rem 1.6rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8f95ff, #5fd3d3);
      color: #0f1218;
      box-shadow: 0 18px 32px rgba(95, 211, 211, 0.25);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(159, 173, 191, 0.18);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .output {
      display: grid;
      gap: 22px;
      padding: 28px;
      background: rgba(10, 15, 22, 0.88);
      border: 1px solid rgba(159, 173, 191, 0.12);
      border-radius: 30px;
    }

    .output h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: rgba(95, 211, 211, 0.16);
      color: #dff7f7;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .metric-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(159, 173, 191, 0.12);
      border-radius: 24px;
      padding: 18px 20px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 1.45rem;
      font-weight: 700;
      color: #f9f7f2;
    }

    .recommendation {
      padding: 22px;
      border-radius: 26px;
      background: rgba(95, 211, 211, 0.12);
      border: 1px solid rgba(95, 211, 211, 0.12);
      color: #e8efe8;
      line-height: 1.75;
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.75;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero-visual {
        min-height: 320px;
      }
      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <article class="hero-copy">
        <div>
          <div class="eyebrow">FLOW NEUROTECH</div>
          <h1>Brain, Performance, Environment - all in one earbud.</h1>
          <p class="lead">discover your current brain state</p>
        </div>
      </article>

    <section class="panel">
      <div class="actions">
        <button class="btn-primary" id="retrieve-btn">Retrieve your brain data</button>
        <button class="btn-secondary" id="spotify-btn">Connect to Spotify</button>
      </div>

      <div id="output" class="output">
        <div>
          <h2>Your brain data will appear here</h2>
          <p class="hint">
            Press “Retrieve your brain data” to generate a simulated alpha/beta/gamma/theta profile, then see your inferred state and the recommended music modulation.
          </p>
        </div>
      </div>
    </section>
  </div>

  <script>
    const STATE_RECOMMENDATIONS = {
      Optimal: "Maintain current ambience; no modulation needed.",
      Drifting: "Raise rhythmic density, add a small tempo lift, reintroduce percussive transients.",
      Drowsy: "Increase loudness modestly, sharpen rhythmic salience, brighten the spectral centroid.",
      Overload: "Strip stems out, reduce information density, use longer note durations.",
      Stress: "Move tempo toward ~60 BPM, apply a low-pass filter, lengthen reverb tail, and use fewer layers.",
      Unknown: "Play balanced ambient music and collect more data before selecting a stronger intervention."
    };

    function normalize(values) {
      const total = values.reduce((sum, value) => sum + value, 0);
      return values.map(value => value / total);
    }

    function simulateBrainData() {
      const raw = [
        Math.random() * 0.55 + 0.10,
        Math.random() * 0.55 + 0.10,
        Math.random() * 0.55 + 0.10,
        Math.random() * 0.55 + 0.10
      ];
      const [alpha, beta, gamma, theta] = normalize(raw);
      return { alpha, beta, gamma, theta };
    }

    function classifyState(sample) {
      const { theta, alpha, beta } = sample;
      const ratio = alpha / theta;

      if (theta > 0.35 && alpha < 0.20 && beta < 0.15 && ratio < 0.6) return "Drowsy";
      if (theta >= 0.20 && theta <= 0.30 && alpha < 0.20 && beta > 0.35 && ratio < 0.9) return "Stress";
      if (theta >= 0.30 && theta <= 0.45 && alpha < 0.25 && beta >= 0.25 && beta <= 0.35 && ratio < 0.9) return "Overload";
      if (theta >= 0.25 && theta <= 0.35 && alpha >= 0.30 && alpha <= 0.45 && beta >= 0.15 && beta <= 0.25 && ratio > 1.4) return "Drifting";
      if (
        theta >= 0.15 && theta <= 0.25 &&
        alpha >= 0.15 && alpha <= 0.30 &&
        beta >= 0.25 && beta <= 0.40 &&
        ratio >= 0.8 && ratio <= 1.5
      ) return "Optimal";

      return "Stressed";
    }

    function formatPercent(value) {
      return `${(value * 100).toFixed(1)}%`;
    }

    function metricCard(name, value) {
      return `
        <div class="metric-card">
          <div class="metric-label">${name}</div>
          <div class="metric-value">${formatPercent(value)}</div>
        </div>
      `;
    }

    const output = document.getElementById("output");
    const retrieveBtn = document.getElementById("retrieve-btn");
    const spotifyBtn = document.getElementById("spotify-btn");

    retrieveBtn.addEventListener("click", () => {
      const sample = simulateBrainData();
      const state = classifyState(sample);
      output.innerHTML = `
        <div>
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
            <div>
              <h2>Brain state: <span class="state-pill">${state}</span></h2>
            </div>
          </div>

          <div class="metrics-grid">
            ${metricCard("Alpha", sample.alpha)}
            ${metricCard("Beta", sample.beta)}
            ${metricCard("Gamma", sample.gamma)}
            ${metricCard("Theta", sample.theta)}
          </div>

          <div class="recommendation">
            <strong>Recommendation</strong>
            <p style="margin: 0.85rem 0 0;">
              ${STATE_RECOMMENDATIONS[state] || STATE_RECOMMENDATIONS.Unknown}
            </p>
          </div>
        </div>
      `;
      spotifyBtn.disabled = false;
    });

    spotifyBtn.addEventListener("click", () => {
      window.open("https://open.spotify.com", "_blank");
    });
  </script>
</body>
</html>
