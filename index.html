<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EEG State Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.5rem; }
    button, select {
      padding: 0.6rem 1rem;
      margin: 0.5rem 0.25rem 1rem 0;
      font-size: 1rem;
    }
    #output {
      white-space: pre-wrap;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .sample-title {
      margin: 1rem 0 0.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>EEG State Simulator</h1>
  <p>
    Simulate EEG band-power fractions, classify the brain state, and get a music recommendation.
  </p>

  <div>
    <button id="btn-all">Simulate All States</button>
    <button id="btn-random">Simulate Random Sample</button>
    <label>
      State:
      <select id="state-select">
        <option value="Optimal">Optimal</option>
        <option value="Drifting">Drifting</option>
        <option value="Drowsy">Drowsy</option>
        <option value="Overload">Overload</option>
        <option value="Stress">Stress</option>
      </select>
    </label>
    <button id="btn-one">Simulate Selected State</button>
  </div>

  <div id="output"></div>

  <script>
    const STATE_RECOMMENDATIONS = {
      Optimal: "Maintain current ambience; no modulation needed.",
      Drifting: "Raise rhythmic density, add a small tempo lift, reintroduce percussive transients.",
      Drowsy: "Increase loudness modestly, sharpen rhythmic salience, brighten the spectral centroid.",
      Overload: "Strip stems out, reduce information density, use longer note durations.",
      Stress: "Move tempo toward ~60 BPM, apply a low-pass filter, lengthen reverb tail, and use fewer layers.",
      Unknown: "Play balanced ambient music and collect more data before selecting a stronger intervention."
    };

    const TARGET_STATES = ["Optimal", "Drifting", "Drowsy", "Overload", "Stress"];

    function normalize(values) {
      const total = values.reduce((sum, v) => sum + v, 0);
      return values.map(v => v / total);
    }

    function classifyBrainState(sample) {
      const { theta, alpha, beta } = sample;
      const ratio = alpha / theta;

      if (theta > 0.35 && alpha < 0.20 && beta < 0.15 && ratio < 0.6) {
        return "Drowsy";
      }
      if (theta >= 0.20 && theta <= 0.30 && alpha < 0.20 && beta > 0.35 && ratio < 0.9) {
        return "Stress";
      }
      if (theta >= 0.30 && theta <= 0.45 && alpha < 0.25 && beta >= 0.25 && beta <= 0.35 && ratio < 0.9) {
        return "Overload";
      }
      if (theta >= 0.25 && theta <= 0.35 && alpha >= 0.30 && alpha <= 0.45 && beta >= 0.15 && beta <= 0.25 && ratio > 1.4) {
        return "Drifting";
      }
      if (
        theta >= 0.15 && theta <= 0.25 &&
        alpha >= 0.15 && alpha <= 0.30 &&
        beta >= 0.25 && beta <= 0.40 &&
        ratio >= 0.8 && ratio <= 1.5
      ) {
        return "Optimal";
      }
      return "Unknown";
    }

    function formatSample(sample) {
      return `theta=${sample.theta.toFixed(3)}, alpha=${sample.alpha.toFixed(3)}, beta=${sample.beta.toFixed(3)}, alpha/theta=${(sample.alpha / sample.theta).toFixed(3)}`;
    }

    function simulateRandomEEG() {
      const raw = [
        Math.random() * 0.95 + 0.05,
        Math.random() * 0.95 + 0.05,
        Math.random() * 0.95 + 0.05
      ];
      const [theta, alpha, beta] = normalize(raw);
      return { theta, alpha, beta };
    }

    function generateIntentionalSample(targetState, attempts = 2000) {
      for (let i = 0; i < attempts; i++) {
        const raw = [
          Math.random() * 0.5 + 0.05,
          Math.random() * 0.5 + 0.05,
          Math.random() * 0.5 + 0.05
        ];
        const [theta, alpha, beta] = normalize(raw);
        const sample = { theta, alpha, beta };
        if (classifyBrainState(sample) === targetState) {
          return sample;
        }
      }

      const fallback = {
        Optimal: { theta: 0.20, alpha: 0.22, beta: 0.35 },
        Drifting: { theta: 0.26, alpha: 0.40, beta: 0.19 },
        Drowsy: { theta: 0.40, alpha: 0.15, beta: 0.10 },
        Overload: { theta: 0.35, alpha: 0.20, beta: 0.30 },
        Stress: { theta: 0.25, alpha: 0.15, beta: 0.40 }
      };
      return fallback[targetState];
    }

    function getMusicRecommendation(state) {
      return STATE_RECOMMENDATIONS[state] || STATE_RECOMMENDATIONS.Unknown;
    }

    function renderResult(title, sample, state, recommendation) {
      return `
<strong class="sample-title">${title}</strong>
${formatSample(sample)}
State: ${state}
Recommendation: ${recommendation}
`;
    }

    const output = document.getElementById("output");
    document.getElementById("btn-all").onclick = () => {
      output.innerHTML = TARGET_STATES.map(state => {
        const sample = generateIntentionalSample(state);
        const recommendation = getMusicRecommendation(state);
        return renderResult(state, sample, state, recommendation);
      }).join("\n");
    };

    document.getElementById("btn-random").onclick = () => {
      const sample = simulateRandomEEG();
      const state = classifyBrainState(sample);
      output.innerHTML = renderResult("Random sample", sample, state, getMusicRecommendation(state));
    };

    document.getElementById("btn-one").onclick = () => {
      const state = document.getElementById("state-select").value;
      const sample = generateIntentionalSample(state);
      output.innerHTML = renderResult(state, sample, state, getMusicRecommendation(state));
    };
  </script>
</body>
</html>
